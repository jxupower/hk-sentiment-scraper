# Local development + local production-parity testing.
#
# `docker compose up --build` boots the same image CI builds (one Dockerfile
# is the source of truth) with the local data/ directory mounted in so the
# SQLite store + cache survives a container recreation.
#
# Production (Oracle Cloud VM) uses a SEPARATE compose file at
# /srv/dashboard/docker-compose.yml — see docs/deploy.md. The prod file
# references the pre-built ghcr.io image instead of `build: .` because the
# Oracle ARM VMs don't have the build toolchain installed (and don't need
# it once the image is pulled).

services:
  # -------------------------------------------------------------------
  # `app` — the Dash web server. Perf P2.9: no longer runs the
  # APScheduler in-process; the sibling `scheduler` service below does
  # that instead. Splitting them stops CPU-bound scrape work (VADER over
  # ~10k articles, MPT solves, GARCH Monte Carlo, monthly walk-forward
  # reoptimize) from holding the GIL and freezing dashboard callbacks.
  # -------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: hk-sentiment-scraper:local
    container_name: hk-sentiment-dashboard
    # Bind to host loopback only — prevents accidentally exposing the
    # dashboard to a LAN before CF Tunnel + Access are in front of it in
    # production. For purely-local dev, http://localhost:8050 still works.
    # The `127.0.0.1:` prefix is REQUIRED — a bare `8050:8050` binds
    # 0.0.0.0 on the host (docker's default), silently defeating the
    # loopback intent above.
    ports:
      - "127.0.0.1:8050:8050"
    # Secrets live in .env at the repo root (never committed — see
    # .gitignore + .dockerignore). The example template is .env.example.
    env_file:
      - .env
    environment:
      # Tell the dashboard NOT to start its in-process APScheduler; the
      # `scheduler` service below does it. Two would double-scrape and
      # race on the SQLite writer lock.
      DISABLE_INPROCESS_SCHEDULER: "true"
    # SQLite + HKEX xlsx cache survive container recreation via this
    # bind mount. Both `app` and `scheduler` mount the same directory
    # so they share `data/sentiment.db` (WAL mode supports concurrent
    # readers; the scheduler is the only writer).
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    depends_on:
      - scheduler
    # The image-level HEALTHCHECK is already correct; restating it here
    # so `docker compose ps` shows the health column consistently.
    healthcheck:
      test:
        - "CMD"
        - "curl"
        - "--fail"
        - "--silent"
        - "http://localhost:8050/_dash-layout"
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  # -------------------------------------------------------------------
  # `scheduler` — APScheduler + scrapers, out-of-process from the
  # dashboard. Runs `main.py scrape` (no --once) in long-running mode.
  # Same image as `app` (one Dockerfile is the source of truth); just
  # a different CMD.
  # -------------------------------------------------------------------
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: hk-sentiment-scraper:local
    container_name: hk-sentiment-scheduler
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    # Override the image CMD (which starts the dashboard) — same venv,
    # same code, different entrypoint. PYTHONIOENCODING=utf-8 avoids
    # the cp1252 encoding trap on Chinese log lines.
    command: ["python", "main.py", "scrape"]
    healthcheck:
      # No HTTP endpoint on the scheduler; the healthiest signal we
      # have is that the Python process is alive. tini-managed process
      # tree means a crash kills PID 1 → container marked unhealthy →
      # restart: unless-stopped kicks in.
      test: ["CMD", "pgrep", "-f", "main.py scrape"]
      interval: 60s
      timeout: 5s
      start_period: 30s
      retries: 3
