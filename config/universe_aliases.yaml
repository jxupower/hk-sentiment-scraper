  # ---- US industrials / defense / auto ---------------------------------
  "F": ["Ford Motor"]
  "GM": ["General Motors"]
  "CAT": ["Caterpillar"]
  "DE": ["John Deere"]
  "GE": ["General Electric"]

  # ---- US energy / utilities -------------------------------------------
  "OXY": ["Occidental Petroleum"]
  "COP": ["ConocoPhillips"]
  "SLB": ["Schlumberger"]
  "NEE": ["NextEra"]
  "SO": ["Southern Company"]
