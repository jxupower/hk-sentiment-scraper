  # ---- US REITs --------------------------------------------------------
  "AMT": ["American Tower"]
  "PLD": ["Prologis"]
  "SPG": ["Simon Property"]
  "PSA": ["Public Storage"]

# Aliases in this set are permitted to be under 4 characters. Case-insensitive.
# The matcher rejects any term shorter than MIN_TERM_LENGTH unless it appears
# here. Keep this tight — every entry is a potential noise source.
#
# Deliberately EMPTY for now. Every 2-3 char English-word ticker (GS, MS,
# F, GM, SO, NOW, ALL, MET, DE, GE, CAT, AI, AMT, COP, OXY) creates massive
# false-positive tagging on unrelated articles. The safer path is:
#   1. The watchlist YAML already covers GS ("Goldman"), MS ("Morgan
#      Stanley"), F ("Ford Motor"), GM ("Chevrolet") etc via full-name
#      aliases, so short-form tagging is redundant.
#   2. The 4+ char aliases above (WuXi Biologics, ServiceNow, Palo Alto
#      Networks, etc.) already give us most of the coverage gain.
# Add entries here only after confirming the short form has no common
# false-positive collision (spot-check article samples first).
short_allow: []
