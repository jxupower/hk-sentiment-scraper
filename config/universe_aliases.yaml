# Curated per-ticker aliases for UNIVERSE-tier tickers (i.e. tickers outside
# the watchlist that still deserve richer matching than "cleaned HKEX name").
#
# Entries listed under `short_allow` are also permitted to bypass the
# matcher's default MIN_TERM_LENGTH=4 filter. Use sparingly — anything under
# 4 chars must be a proper ticker/abbreviation with well-bounded
# false-positive risk (e.g. "GS" for Goldman Sachs, "AMD" for Advanced
# Micro Devices). "IT" or "CO" would be terrible additions.
#
# Grow organically: when a sub-sector still shows 0 articles after the feed
# expansion, look at whether its top mcap constituents have common press
# nicknames and add them here.

aliases:
  # ---- HK biotech / pharma ---------------------------------------------
  "0570.HK": ["China TCM", "China Traditional Chinese Medicine"]
  "1093.HK": ["CSPC", "CSPC Pharmaceutical"]
  "2269.HK": ["WuXi Biologics"]
  "2359.HK": ["WuXi AppTec"]
  "1801.HK": ["Innovent Biologics"]
  "6160.HK": ["BeiGene"]
  "1177.HK": ["Sino Biopharm"]

  # ---- HK consumer / F&B / retail --------------------------------------
  "6862.HK": ["Haidilao"]
  "9868.HK": ["XPeng"]
  "2020.HK": ["Anta Sports"]
  "2331.HK": ["Li Ning"]
  "1929.HK": ["Chow Tai Fook"]

  # ---- HK utilities / infrastructure -----------------------------------
  "0002.HK": ["CLP", "CLP Holdings"]
  "0006.HK": ["Power Assets", "HK Electric"]
  "0003.HK": ["Towngas", "Hong Kong and China Gas"]

  # ---- HK industrials --------------------------------------------------
  "0669.HK": ["Techtronic", "TTI"]
  "0388.HK": ["HKEX", "Hong Kong Exchanges"]

  # ---- US software / cloud / AI ----------------------------------------
  "CRM": ["Salesforce"]
  "NOW": ["ServiceNow"]
  "SNOW": ["Snowflake"]
  "PANW": ["Palo Alto Networks"]
  "DDOG": ["Datadog"]
