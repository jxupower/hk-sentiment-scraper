  # ---- US financials ---------------------------------------------------
  "GS": ["Goldman"]
  "MS": ["Morgan Stanley"]
  "AXP": ["Amex", "American Express"]
  "COF": ["Capital One"]
  "PGR": ["Progressive"]
  "TRV": ["Travelers"]
  "MET": ["MetLife"]
