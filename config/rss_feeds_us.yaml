feeds:
  # General US business news — broad coverage. CNBC's US feed is the cleanest;
  # Yahoo Finance and MarketWatch fill in macro / earnings angles. The legacy
  # feeds.reuters.com URL was retired years ago — replaced with a Google
  # News "site:reuters.com business" query below.
  - name: CNBC US Markets
    url: https://www.cnbc.com/id/15839135/device/rss/rss.html
  - name: Yahoo Finance Headlines
    url: https://finance.yahoo.com/news/rssindex
  - name: MarketWatch Top Stories
    url: https://feeds.content.dowjones.io/public/rss/mw_topstories
  - name: Google News - Reuters business
    url: https://news.google.com/rss/search?q=site%3Areuters.com+business&hl=en-US&gl=US&ceid=US:en

  # Broad Google News queries targeting US-listed equities and the macro
  # context that moves them. The TickerMatcher decides which tickers each
  # article is about, so feeds intentionally avoid being per-sector.
  - name: Google News - S&P 500 / Nasdaq macro
    url: https://news.google.com/rss/search?q=%22S%26P+500%22+OR+%22Nasdaq%22+OR+%22Dow+Jones%22&hl=en-US&gl=US&ceid=US:en
  - name: Google News - US equities macro
    url: https://news.google.com/rss/search?q=%22US+stocks%22+OR+%22US+equities%22+OR+%22Wall+Street%22&hl=en-US&gl=US&ceid=US:en
  - name: Google News - Fed policy
    url: https://news.google.com/rss/search?q=%22Federal+Reserve%22+OR+%22FOMC%22+OR+%22Powell%22+OR+%22Fed+rate%22&hl=en-US&gl=US&ceid=US:en
  - name: Google News - earnings season
    url: https://news.google.com/rss/search?q=%22earnings%22+%22quarter%22+%22US%22+OR+%22revenue+miss%22+OR+%22guidance%22&hl=en-US&gl=US&ceid=US:en
  - name: Google News - US tech / AI stocks
    url: https://news.google.com/rss/search?q=%22US+tech%22+OR+%22AI+stocks%22+OR+%22Magnificent+Seven%22+OR+%22semiconductor%22&hl=en-US&gl=US&ceid=US:en
  - name: Google News - US bank financials
    url: https://news.google.com/rss/search?q=%22US+banks%22+OR+%22US+financials%22+OR+%22regional+banks%22&hl=en-US&gl=US&ceid=US:en
  - name: Google News - US energy commodities
    url: https://news.google.com/rss/search?q=%22US+oil%22+OR+%22shale%22+OR+%22US+gas%22+OR+%22ExxonMobil%22+OR+%22Chevron%22&hl=en-US&gl=US&ceid=US:en
  - name: Google News - US healthcare biotech
    url: https://news.google.com/rss/search?q=%22US+biotech%22+OR+%22FDA+approval%22+OR+%22US+pharma%22&hl=en-US&gl=US&ceid=US:en

  # Cluster feeds — each targets a specific under-covered sub-sector cluster
  # so the Sentiment tab isn't blank for utilities / REITs / insurance /
  # chemicals etc. Kept as broad OR-queries so a single feed covers 2-4
  # related sub-sectors without needing per-sector plumbing.
  - name: Google News - US insurance
    url: https://news.google.com/rss/search?q=%22US+insurance%22+OR+%22P%26C+insurance%22+OR+%22property+casualty%22+OR+%22insurance+carrier%22&hl=en-US&gl=US&ceid=US:en
  - name: Google News - US REITs
    url: https://news.google.com/rss/search?q=%22REIT%22+OR+%22real+estate+investment+trust%22+OR+%22mortgage+REIT%22&hl=en-US&gl=US&ceid=US:en
  - name: Google News - US utilities
    url: https://news.google.com/rss/search?q=%22US+utilities%22+OR+%22electric+utility%22+OR+%22power+company%22+OR+%22utility+earnings%22&hl=en-US&gl=US&ceid=US:en
  - name: Google News - US small-cap biotech clinical
    url: https://news.google.com/rss/search?q=%22clinical+trial%22+OR+%22FDA+phase%22+OR+%22biotech+IPO%22+OR+%22PDUFA%22&hl=en-US&gl=US&ceid=US:en
  - name: Google News - US chemicals industrials
    url: https://news.google.com/rss/search?q=%22chemical+company%22+OR+%22specialty+chemicals%22+OR+%22US+industrials%22&hl=en-US&gl=US&ceid=US:en
  - name: Google News - US consumer retail
    url: https://news.google.com/rss/search?q=%22US+retailer%22+OR+%22packaged+foods%22+OR+%22consumer+staples%22+OR+%22grocery+chain%22&hl=en-US&gl=US&ceid=US:en
  - name: Google News - US SaaS enterprise software
    url: https://news.google.com/rss/search?q=%22SaaS+company%22+OR+%22enterprise+software%22+OR+%22cloud+vendor%22&hl=en-US&gl=US&ceid=US:en
  - name: Google News - US medical devices
    url: https://news.google.com/rss/search?q=%22medical+devices%22+OR+%22medtech%22+OR+%22diagnostic+company%22&hl=en-US&gl=US&ceid=US:en
